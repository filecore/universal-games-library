<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Universal Games Library</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ build_id }}">
</head>
<body>
    <header>
        <h1>Universal Games Library</h1>
        <div class="header-right">
            <span id="stats"></span>
            <span id="auth-area">
                <button type="button" id="login-btn" class="link-btn">Log in</button>
            </span>
        </div>
    </header>

    <aside id="filters">
        <h2>Search</h2>
        <input type="text" id="f-search" placeholder="Title contains...">

        <h2>Store</h2>
        <div id="f-store"></div>

        <h2>Platform</h2>
        <div id="f-platform"></div>

        <h2>Type</h2>
        <label><input type="checkbox" id="f-digital"> Digital</label>
        <label><input type="checkbox" id="f-physical"> Physical</label>

        <h2>Player count</h2>
        <label>Min: <input type="number" id="f-pmin" min="1"></label>
        <label>Max: <input type="number" id="f-pmax" min="1"></label>

        <h2>Multiplayer</h2>
        <label><input type="checkbox" id="f-local-coop"> Local coop</label>
        <label><input type="checkbox" id="f-online-coop"> Online coop</label>
        <label><input type="checkbox" id="f-local-vs"> Local vs</label>
        <label><input type="checkbox" id="f-online-vs"> Online vs</label>

        <h2>Genres</h2>
        <div id="f-genre"></div>

        <section id="management" hidden>
            <h2>Status</h2>
            <div id="status-block"></div>

            <h2>Refresh</h2>
            <button type="button" id="run-steam">Steam</button>
            <button type="button" id="run-bgg">BGG (API)</button>
            <button type="button" id="enrich-bgg-images">Enrich BGG covers</button>

            <details>
                <summary>Manual import</summary>
                <form id="manual-form">
                    <label>Store:
                        <select name="store" required>
                            <option value="bgg">BGG</option>
                            <option value="psn">PSN</option>
                            <option value="epic">Epic</option>
                            <option value="ubisoft">Ubisoft</option>
                            <option value="blizzard">Blizzard</option>
                            <option value="steam">Steam</option>
                        </select>
                    </label>
                    <input type="file" name="file" accept=".csv,.json" required>
                    <button type="submit">Upload</button>
                </form>
            </details>

            <div id="ingest-status"></div>
        </section>
    </aside>

    <main id="games"></main>

    <div id="login-modal" class="modal-overlay" hidden>
        <div class="modal-card">
            <h2>Sign in</h2>
            <p class="sub">Required to manage library content.</p>
            <form id="login-form">
                <label for="login-username">Username</label>
                <input id="login-username" name="username" type="text" autocomplete="username" autofocus required>
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                <div id="login-error" class="error" hidden></div>
                <div class="row">
                    <button type="button" id="login-cancel" class="ghost">Cancel</button>
                    <button type="submit">Sign in</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js?v={{ build_id }}"></script>
</body>
</html>
